[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-tray"
version = "0.1.0"
description = "A lightweight personal GTK3 tray companion for Void Linux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["feedparser>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
flux-tray = "flux_tray.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
