# Flux Tray configuration (translated from void-tray)

[weather]
lat = 45.361698
lon = 26.775255
alerts = true
country = romania
region = Buzău
interval = 30

[feeds]
sources =
    https://github.com/void-linux/void-packages/commits/master.atom|Void packages|30||
    https://github.com/void-linux/xbps/commits/master.atom|xbps|1440||
    https://voidlinux.org/atom.xml|Void news|1440||
    https://feed.itsfoss.com|foss|60||
    http://distrowatch.com/news/dwp.xml|Distro pkg|360||
    http://distrowatch.com/news/dwd.xml|Distros|360||
    https://snoop.ro/feed|Snoop|30||
    https://www.biziday.ro/feed|Biziday|30||
    https://hotnews.ro/feed|Hotnews|10|category=esential, Food, SuperLiga, Fiscalitatea la zi, Pariuri - Publicitate; author=codruta.predatu@zyxgroup.ro|category=Opinii
    https://www.g4media.ro/feed|G4media|10|category=*fashion*,*formula 1*,*advertorial*, Comunicate de presa, redbull racing, Turul Franței 2027; author=MedLife|author=Cristian Pantazi, Dan Tăpălagă, Liviu Avram
    https://gosu3.substack.com/feed|Gosu|720||
    https://www.contributors.ro/feed|Contributors|60||
    https://www.reddit.com/r/voidlinux/.rss|Void reddit|720||

[mute]
rules =
    category:(P)
    category:[p]
    category:(Parteneriat)
    category:loto

[highlight]
rules =
    breaking

[live]
interval = 10
quality = 720p60,720p,best

[youtube]
# YouTube channels are stored in live.json state file, not config
# interval = 10
# quality = 720p,480p,best

[launcher]
Files = ["thunar", "~"]
FF = ["/home/l/.local/bin/firefox-private-vpn"]
Mousepad = ["mousepad"]
di = ["mpv", "/home/l/Videos/the diplomat/"]
Scrot = ["scrot", "-s", "-l", "style=dash,width=3,color=red", "-", "|", "tee", "~/Desktop/screenshot.png", "|", "xclip", "-selection", "clipboard", "-target", "image/png"]
protv = ["mpv", "https://cmero-ott-live.ssl.cdn.cra.cz/channels/cme-ro-voyo-news/playlist.m3u8?offsetSeconds=0&url=0"]
a1 = ["mpv", "https://live4dai.antenaplay.ro/live2_sdi14/live2_sdi14_600k.m3u8"]

[timer]
max = 360
step = 60

[network]
reset_command = ["/home/l/.local/bin/reset-network.sh"]

[updates]
interval = 12
installer = topgrade
steps = system,flatpak,shell,rustup,pi,github_cli_extensions,claude_code,claude_code_plugins,codex,uv,hermes_agent
orphans = true

[media]
interval = 30
ahead = 2
path = ~/Videos
yt_dlp = --sub-langs ro,en
screen_height = 768

[connectivity]
interval = 10
reset_command = ["/home/l/.local/bin/reset-network.sh"]
