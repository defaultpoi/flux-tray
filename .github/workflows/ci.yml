name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']  # the oldest Python the app accepts, and the one it is written on
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb gir1.2-gtk-3.0 libgirepository1.0-dev libcairo2-dev pkg-config gcc ffmpeg
      - name: Python ${{ matrix.python }} with PyGObject
        run: |
          pipx install uv
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python "pygobject<3.51" pycairo feedparser pyflakes yt-dlp requests beautifulsoup4
      - name: Static checks
        run: |
          .venv/bin/python -m compileall -q flux_tray tests
          .venv/bin/python -m pyflakes flux_tray tests flux-tray
          sh -n install.sh && sh -n uninstall.sh
      - name: Tests (real GTK)
        run: |
          set +e
          xvfb-run -a .venv/bin/python -m unittest discover -s tests -v 2>&1 | tee tests-real.log
          status=${PIPESTATUS[0]}
          # the log of a job cannot be read from outside: say which tests failed where the API shows it
          grep -E "^(FAIL|ERROR): " tests-real.log | while read -r line; do echo "::error title=Test failed::$line"; done
          first=$(grep -m1 -A25 -E "^(FAIL|ERROR): " tests-real.log | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$first" ] && echo "::error title=First failure in full::$first"
          exit $status
      - name: Tests (GTK stubbed)
        run: |
          set +e
          .venv/bin/python tests/run_stubbed.py 2>&1 | tee tests-stubbed.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAIL|ERROR): " tests-stubbed.log | while read -r line; do echo "::error title=Stubbed test failed::$line"; done
          first=$(grep -m1 -A25 -E "^(FAIL|ERROR): " tests-stubbed.log | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$first" ] && echo "::error title=First stubbed failure in full::$first"
          exit $status
