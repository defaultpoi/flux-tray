name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb gir1.2-gtk-3.0 libgirepository1.0-dev libcairo2-dev pkg-config gcc ffmpeg
      - name: Python 3.14 with PyGObject
        run: |
          pipx install uv
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python "pygobject<3.51" pycairo feedparser pyflakes yt-dlp
      - name: Static checks
        run: |
          .venv/bin/python -m compileall -q flux_tray tests
          .venv/bin/python -m pyflakes flux_tray tests flux-tray
          sh -n install.sh && sh -n uninstall.sh
      - name: Tests (real GTK)
        run: xvfb-run -a .venv/bin/python -m unittest discover -s tests -v
      - name: Tests (GTK stubbed)
        run: .venv/bin/python tests/run_stubbed.py
